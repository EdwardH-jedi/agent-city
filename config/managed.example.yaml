# Managed runs — trusted local configuration. Copy it OUTSIDE the repo (e.g.
# ~/.agentcity/managed.yaml), edit it, and point MANAGED_CONFIG at the copy.
# Everything that can become a process comes from this file: nothing in a task, a repository file
# or a model's output is ever executed as a command.

# Where worktrees and evidence go. Must not overlap any repo below. Preserved after a run.
workspace_root: ~/.agentcity/managed/workspaces
artifacts_root: ~/.agentcity/managed/artifacts

# Absolute path of git (default /usr/bin/git).
git_executable: /usr/bin/git

# The allowlist. A task can only target a repo listed here.
# Do not list the Agent City checkout you are developing in; use a disposable repo to try it out
# (`bun run managed:demo --init` creates one and a ready-made config).
repos:
  - id: local/my-sandbox          # owner/name, or local/<dir> for a checkout without a GitHub origin
    path: /absolute/path/to/my-sandbox
    base_ref: main                # resolved to a commit when a task is created
    # Trusted verification commands: argv arrays (no shell), absolute argv[0], run in the worktree.
    # A candidate can only become human-ready if at least one is configured and all exit 0.
    verification:
      - name: test
        argv: ["/opt/homebrew/bin/bun", "test"]
        timeout_s: 300

# Live execution (real Claude implement + real Codex review). OFF by default.
# Turning it on uses your CLI logins and your subscription quota. Read docs/managed-runs.md first.
live:
  enabled: false
  # claude:
  #   executable: /absolute/path/to/claude
  #   model: opus
  #   timeout_s: 1800
  #   tools: [Read, Edit, Write, Glob, Grep]   # no Bash: verification is run by Agent City
  #   allowed_auth_methods: []   # authMethod values of `claude auth status --json` that are your
  #                              # SUBSCRIPTION login; empty = every live run is blocked
  # codex:
  #   executable: /absolute/path/to/codex
  #   model: <a model your Codex login can use>
  #   timeout_s: 900
  #   auth_status_pattern: null  # regex matching ONLY the ChatGPT-login output of `codex login status`;
  #                              # null = every live review is blocked (Codex has no JSON status)

# Optional worker profiles: workers described by durable role + capability, not by one model.
# DESCRIPTIVE ONLY — a profile never launches a model, never enables live execution (only `live`
# above does) and holds no executable, credential or push/PR/deploy authority (unknown keys are
# rejected). Omit the section entirely (or use []) and nothing changes, approvals included.
#   role:             clerk | implementer | reviewer | decision
#   capability_tier:  fast < standard < senior < principal; `specialist` is off that scale and is
#                     matched only when asked for explicitly
#   mutability:       read_only | worktree   (reviewer/decision: read_only; implementer: worktree)
#   model:            required for claude/openai/codex/local (no default model); null for jev/fake
#   latency_class:    low | medium | high       cost_class: none | low | medium | high
#   enabled (default true), max_concurrency 1..16 (default 1), label (optional, display only)
# Approval binding: ENABLED profiles are part of the policy hash, so changing, enabling or disabling one
# voids approvals made under the old set; a disabled profile is never used and is not bound.
# worker_profiles:
#   - profile_id: fast-clerk
#     provider: claude
#     role: clerk
#     capability_tier: fast
#     model: haiku
#     mutability: read_only
